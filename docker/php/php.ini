; FaPost Core PHP settings.
;
; Only values that differ from the php:8.4 defaults for a reason worth stating.

; Flow execution holds a session while waiting on external APIs, and Filament
; builds large forms, so the default 128M is tight for workers.
memory_limit = 512M

; Media uploads flow through the admin panel and channel adapters.
upload_max_filesize = 32M
post_max_size = 32M

; Webhook ingress must answer providers quickly; long requests belong in queues.
max_execution_time = 60

; Errors go to the container log, never to the response body — a stack trace in
; a webhook reply leaks paths and configuration to whoever triggered it.
display_errors = Off
log_errors = On
error_log = /dev/stderr

; OPcache is what makes PHP-FPM viable under load.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Code never changes inside a running container, so the timestamp check is pure
; overhead. Deploying means a new image, not editing files in place.
opcache.validate_timestamps = 0

; Dates are computed in UTC everywhere; the application converts for display.
date.timezone = UTC

; Reduce fingerprinting.
expose_php = Off
