; FAPost Core PHP settings — development.
;
; Same file as production except where development genuinely needs different
; behaviour. Kept as a separate file rather than a pile of environment
; overrides so the difference between the two is one diff you can read.

memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 32M

; Longer than production: a request paused on a breakpoint would otherwise be
; killed mid-debug.
max_execution_time = 0

; Errors go to the response as well as the log — the whole point of a
; development environment is seeing what broke without digging.
display_errors = On
display_startup_errors = On
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; OPcache stays on, because running without it hides timing problems that only
; appear in production. What changes is revalidation: without this, edits to a
; bind-mounted file would be ignored until the container restarted, and you
; would be debugging code that is no longer on disk.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

date.timezone = UTC

; Xdebug, active only when the image was built with INSTALL_XDEBUG=1. Left in
; `debug` mode but triggered on demand: always-on step debugging slows every
; request, including the ones you are not looking at.
;
; The address of your IDE is deliberately not set here. It differs per host, and
; a value baked into the image would be wrong for someone. Xdebug reads the
; XDEBUG_CONFIG environment variable, which compose passes through — see
; compose.dev.yaml.
[xdebug]
xdebug.mode = debug
xdebug.start_with_request = trigger
xdebug.client_port = 9003
xdebug.idekey = PHPSTORM
xdebug.max_nesting_level = 512
