; PHP-FPM pool overrides.
;
; The base image ships a pool tuned for a shared host. These values assume the
; container has the machine to itself, which is the point of running it as one.

[www]
listen = 9000

; Dynamic scaling suits a web tier whose load arrives in bursts: idle children
; are reaped, and a spike does not wait for children to be forked one at a time.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; Long-lived PHP processes accumulate fragmentation. Recycling bounds it without
; the cost of respawning on every request.
pm.max_requests = 500

; Surface the pool's own diagnostics to the container log rather than a file
; nobody will look inside.
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2

; Requests slower than this are logged with a stack trace, which is how you find
; the one endpoint holding children hostage.
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

; Environment values are passed through from compose; without this list PHP-FPM
; clears them and the application boots with no configuration at all.
clear_env = no
