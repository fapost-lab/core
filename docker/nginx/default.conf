# FAPost Core web tier.
#
# Terminates nothing: TLS belongs to whatever sits in front (Traefik, Caddy, a
# load balancer). This server block only routes to PHP-FPM and serves static files.

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Webhook payloads are small; admin uploads are not. Keep this in step with
    # upload_max_filesize in php.ini — the smaller of the two wins, silently.
    client_max_body_size 32M;

    # Providers deliver over unreliable networks and retry on timeout, so a slow
    # upstream must not turn one delivery into several.
    proxy_read_timeout 60s;
    fastcgi_read_timeout 60s;

    # The application decides what is cacheable; nginx does not guess.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Vite output is content-hashed, so it can be cached indefinitely.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # The real client address, so rate limiting and logs are meaningful.
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;

        fastcgi_hide_header X-Powered-By;
    }

    # Dotfiles are never served: .env sits one directory up, but a misplaced copy
    # inside public/ would otherwise be downloadable.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    access_log /dev/stdout;
    error_log /dev/stderr;
}
