# FAPost Core — full stack.
#
#   docker compose --env-file ../.env up -d
#
# The gateway is optional and sits behind a profile, so a plain `up` gives the
# supported setup without it:
#   docker compose --env-file ../.env --profile gateway up -d
#
# Images are pulled from the registry. To build them locally instead — which is
# what you need when shipping Solutions or Plugins of your own, since those are
# Composer packages that must live inside the application image — merge the build
# overlay on top:
#
#   docker compose -f compose.yaml -f compose.build.yaml --env-file ../.env up -d --build
#
# The build definitions live in that separate file on purpose: a service that
# declares a `build:` is one Compose will build, and with both keys present it
# never contacts the registry at all.
#
# Configuration comes from ../.env — the same file the application reads outside
# containers, so there is one place to look and nothing to keep in step.

name: fapost

x-app: &app
  image: ${REGISTRY:-ghcr.io/fapost-lab}/core:${APP_VERSION:-latest}
  # Which file the containers read. Override with ENV_FILE to run a second
  # environment from the same compose file — staging alongside production, or a
  # throwaway stack for testing an upgrade.
  env_file: ${ENV_FILE:-../.env}
  environment:
    # Container networking overrides whatever the file says about hosts: inside
    # compose these are service names, not localhost.
    DB_HOST: postgres
    DB_PORT: 5432
    REDIS_HOST: redis
    REDIS_PORT: 6379
  volumes:
    # The only writable path. Application code stays in the image, so a deploy
    # is a new image rather than a directory someone edited in place.
    - storage:/var/www/html/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    # PHP-FPM. Not published: nginx is the only thing that talks to it.
    expose:
      - "9000"

  web:
    # Carries the server config and the compiled front-end, so nothing from this
    # repository has to be mounted and the compose file stands on its own.
    image: ${REGISTRY:-ghcr.io/fapost-lab}/web:${APP_VERSION:-latest}
    depends_on:
      - app
    ports:
      # Bound to all interfaces so a fresh install is reachable immediately.
      # When the tls profile is on, set HTTP_BIND=127.0.0.1 so this port is not
      # a way around Caddy and its certificate.
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8000}:80"
    restart: unless-stopped

  horizon:
    <<: *app
    command: ["entrypoint", "horizon"]
    # No ports: this is a worker. Losing it stops all message processing while
    # the site keeps serving, which is why it is a first-class service here.
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  scheduler:
    <<: *app
    command: ["entrypoint", "scheduler"]
    # Exactly one replica. Two schedulers means every scheduled trigger fires twice.
    deploy:
      replicas: 1

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-fapost}
      POSTGRES_USER: ${DB_USERNAME:-fapost}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in ../.env}
    volumes:
      - postgres:/var/lib/postgresql/data
      # Grants CREATE on the database: tenant provisioning issues CREATE SCHEMA
      # at runtime, and without it the first tenant fails after a clean install.
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-fapost} -d ${DB_DATABASE:-fapost}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Persistence on: Redis holds the webhook routing cache and the queues. The
    # cache rebuilds itself, but queued jobs are real work that would be lost.
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in ../.env}
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  # TLS termination with automatic Let's Encrypt certificates.
  #
  # Behind a profile because it is only the right answer for a host that owns
  # ports 80 and 443. If you already run Traefik, nginx or a cloud load
  # balancer, leave this off and point it at the `web` service instead.
  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. Losing this volume means re-issuing
      # every certificate, which the rate limits punish.
      - caddy-data:/data
      - caddy-config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set to use the tls profile}
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set to use the tls profile}
    restart: unless-stopped

  gateway:
    profiles: ["gateway"]
    image: ${REGISTRY:-ghcr.io/fapost-lab}/gateway:${GATEWAY_VERSION:-latest}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # As with web: set GATEWAY_BIND=127.0.0.1 when Caddy fronts this, so the
      # plain-HTTP port is not a way past TLS.
      - "${GATEWAY_BIND:-0.0.0.0}:${GATEWAY_PORT:-8080}:8080"
    environment:
      GATEWAY_ADDR: ":8080"
      # Falls back to the application's own ingress on a cache miss, so a cold
      # Redis costs throughput rather than dropped deliveries.
      GATEWAY_UPSTREAM_URL: "http://web:80"
      GATEWAY_LOG_FORMAT: "json"
      GATEWAY_LOG_DESTINATION: "stdout"
      GATEWAY_LOG_LEVEL: "${GATEWAY_LOG_LEVEL:-info}"
      # Only a proxy listed here may set X-Forwarded-For; from anyone else the
      # header is ignored, or a caller could forge a client address and walk
      # past the rate limit. Set this to the address of whatever terminates TLS.
      GATEWAY_TRUSTED_PROXIES: "${GATEWAY_TRUSTED_PROXIES:-}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_PREFIX: "${REDIS_PREFIX:-}"
      REDIS_DB: "${REDIS_DB:-0}"
    healthcheck:
      # The scratch image has no shell or curl; the binary answers for itself.
      test: ["CMD", "/gateway", "--version"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  postgres:
  redis:
  storage:
  caddy-data:
  caddy-config:
