# Profile manifest. Flat YAML subset, same reader as .ai/config.yaml.
name: node
description: Node.js projects (pnpm/yarn/bun/npm, chosen by packageManager or lock file; test, lint, typecheck scripts).
detect: [package.json]
scope: [changed, map, explain, environment]
# The checks of this profile by role, and the index of its check table
# (schemas/profile.md, Check table). Another profile can take one over by name
# (`covers: [node:tests]`).
checks: [tests, lint, typecheck]
# tests: the "test" script of the package manager verify.sh finds, or the
# project's own jest or vitest on a narrowed run; the table names no command
# because the tool is chosen at run time. A narrowed run passes the test files
# it selected.
checks.tests.narrowed: {selection}
# lint: the "lint" script, or the project's own eslint on a narrowed run, which
# gets the changed js/ts files.
checks.lint.narrowed: {selection}
# typecheck: the "typecheck" script, never narrowed by files; nothing to
# declare beyond the role.
carry: [node_modules]
lock: [package-lock.json, yarn.lock, pnpm-lock.yaml, bun.lockb]
