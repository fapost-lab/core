# Profile manifest. Flat YAML subset, same reader as .ai/config.yaml.
name: laravel
description: Laravel applications — a layer over php that runs its tests through artisan.
detect: [artisan]
extends: php
# php:tests, run through artisan: `php artisan test` runs the suite phpunit or
# pest would, over php's own selection of test files (schemas/profile.md,
# Layer overrides).
checks.tests.command: php artisan test
carry: [.env]
