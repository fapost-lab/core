# Builds and publishes the container images an operator deploys.
#
# Images go to GitHub Container Registry: it sits beside the code, costs nothing
# for public images, has no pull rate limit for anonymous users, and CI signs in
# with the token GitHub issues automatically — there is no secret to store.
#
# Multi-architecture on purpose. Developer machines are increasingly arm64 while
# most servers are amd64, and an image built for one silently refuses to start on
# the other.

name: Publish images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest

    strategy:
      # Images are independent; one failing should not hide the others' results.
      fail-fast: false
      matrix:
        include:
          # core and web share one Dockerfile: the front-end build needs the
          # Composer result, so both come out of the same dependency install.
          - name: core
            dockerfile: docker/Dockerfile
            context: .
            target: core
          - name: web
            dockerfile: docker/Dockerfile
            context: .
            target: web
          - name: gateway
            dockerfile: gateway/Dockerfile
            context: gateway
            target: ""

    steps:
      - uses: actions/checkout@v4

      # QEMU lets an amd64 runner emit arm64 layers.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          # The short SHA is always applied, so any running container can be
          # traced back to a commit.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          # Layer cache: without it every run recompiles the PHP extensions and
          # reinstalls Composer packages from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max
