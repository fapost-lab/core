# The checks a change has to pass before it reaches main.
#
# Runs on every pull request and on every push to main, so a merged change is
# checked once more on the exact commit a release tag would point at. The parts
# of the repository (PHP application, Go gateway, Vue builder, container images)
# have nothing in common at build time, so they are separate jobs and run at once.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.5"
  NODE_VERSION: "26"

jobs:
  php:
    name: PHP (${{ matrix.database }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # SQLite is what phpunit.xml and the pre-commit hook use, so it matches
        # what a developer saw locally. PostgreSQL is what production runs on:
        # schema-per-tenant switching, partitioned tables and uuid columns
        # behave differently from SQLite, and this leg is where they are
        # exercised (tests/Feature/FeatureTestCase.php migrates the tenant
        # tables into a schema of their own there).
        database: [sqlite, pgsql]

    services:
      postgres:
        # Kept in step with the version operators are told to run. The sqlite
        # leg starts it too and ignores it; a conditional service is not
        # something the matrix can express.
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fapost
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: fapost_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fapost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        # Session locks and the hot-path registry are exercised against a real
        # Redis in a few feature tests (tests/Feature/Domains/Flow/Routing);
        # the array cache store phpunit.xml configures does not cover those.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          # The same set the production image installs (docker/Dockerfile),
          # plus pdo_sqlite for the test database.
          extensions: pdo_pgsql, pdo_sqlite, intl, bcmath, zip, gd, pcntl, sockets, redis
          coverage: none
        env:
          fail-fast: true

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        # fapost/foundation and fapost/support are public, but they are `vcs`
        # repositories: Composer reads them through the GitHub API and their
        # zipballs come from api.github.com. Unauthenticated that is 60 calls
        # an hour per IP, and past it Composer falls back to `git clone` over
        # SSH and fails with a misleading "Permission denied (publickey)".
        # The token every run gets automatically lifts the limit.
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Code style
        # --test reports without changing anything; a style problem fails the
        # job so it is fixed in the branch, not silently on main.
        run: vendor/bin/pint --test

      - name: Create the landlord database
        # The landlord connection gets a database of its own, as the local
        # PostgreSQL setup in docs/site/contributing/testing.mdx has it. The
        # service only creates POSTGRES_DB; psql ships on the runner image.
        if: matrix.database == 'pgsql'
        run: psql -h 127.0.0.1 -U fapost -d fapost_test -c 'CREATE DATABASE fapost_landlord_test'
        env:
          PGPASSWORD: secret

      - name: Tests
        env:
          # phpunit.xml sets these for SQLite; a variable that already exists
          # in the environment wins, which is how the pgsql leg switches over.
          DB_CONNECTION: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ${{ matrix.database == 'pgsql' && 'fapost_test' || ':memory:' }}
          DB_USERNAME: fapost
          DB_PASSWORD: secret
          LANDLORD_DB_DRIVER: ${{ matrix.database }}
          LANDLORD_DB_DATABASE: ${{ matrix.database == 'pgsql' && 'fapost_landlord_test' || ':memory:' }}
          TENANT_DB_CONNECTION: ${{ matrix.database }}
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          # The service runs without requirepass; the literal null is what
          # Laravel reads as "no password" (.env.example ships a password).
          REDIS_PASSWORD: "null"
        run: php artisan test --parallel --compact

      - name: Architecture rules
        # Static analysis; the database it runs against is irrelevant.
        if: matrix.database == 'sqlite'
        run: composer run test:arch

  # A real external Solution, installed into this change's Core the way an
  # operator installs one, and its own test suite run against it. Core's
  # fixtures build their vendor tree by hand (tests/Support/FakeVendor.php), so
  # they cannot prove the overlay → installed.json → manifest → provider path,
  # nor that what Solution tests build on still works. Without this job such a
  # break surfaces later, in the Solution's CI, against a Core already merged.
  #
  # The interim form of the first-solution roadmap item "Core's CI generates,
  # installs and tests a fresh package on every run": once the generator
  # exists, a generated package replaces or joins this one.
  solution:
    name: Solution (hello-world)
    runs-on: ubuntu-latest

    env:
      # Pinned to a commit, not a branch: a change in the Solution's repository
      # must never turn a Core pull request red that did not cause it. The pin
      # is moved on purpose, in a Core pull request, when the Solution's tests
      # change (for example to use the Solution testing kit); the commit only
      # has to be reachable on some branch of that repository, merged or not.
      SOLUTION_REPOSITORY: fapost-lab/solution-hello-world
      SOLUTION_REF: c806df9d0564cc901a0462ec71198d50921daa9a
      SOLUTION_PACKAGE: fapost/solution-hello-world
      SOLUTION_PATH: packages/solution-hello-world

    steps:
      - uses: actions/checkout@v7

      # Under packages/, where the overlay and Core's tooling expect a package
      # checkout to be. The repository is public, so no token of its own.
      - name: Check out the Solution
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOLUTION_REPOSITORY }}
          ref: ${{ env.SOLUTION_REF }}
          persist-credentials: false
          path: ${{ env.SOLUTION_PATH }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pdo_sqlite, intl, bcmath, zip, gd, pcntl, sockets, redis
          coverage: none
        env:
          fail-fast: true

      # The same key as the PHP job, so both read one cache: the overlay keeps
      # Core's locked versions and only adds the Solution, which is a path
      # repository and never downloaded.
      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Describe the overlay
        run: |
          cat > composer.overlay.json <<JSON
          {
            "repositories": [{ "type": "path", "url": "${SOLUTION_PATH}" }],
            "require": { "${SOLUTION_PACKAGE}": "@dev" }
          }
          JSON

      - name: Install Core with the Solution
        # COMPOSER_AUTH: see the PHP job's install step.
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        # The script is run directly, because through `composer overlay`
        # --no-scripts would switch the overlay itself off. Core's post-update
        # scripts run development tooling a CI checkout has no use for; package
        # discovery runs in the next step. --require-overlay: a lost overlay
        # file must fail the job, not pass as a Core-only install.
        run: php tools/composer-overlay.php --require-overlay -- --no-scripts --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        # Composer commands after the overlay read the overlaid manifest.
        env:
          COMPOSER: composer.local.json
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          composer run-script post-autoload-dump --no-interaction

      - name: Solution tests
        # The Solution's own phpunit.xml (SQLite in memory); its bootstrap
        # finds Core's autoloader by walking up from packages/.
        working-directory: ${{ env.SOLUTION_PATH }}
        run: php ../../vendor/bin/phpunit -c phpunit.xml

  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      - run: go vet ./...
      - run: go test ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run type-check
      - run: npm test
      # The production image runs this same build; a change that breaks it
      # should fail here rather than at release time.
      - run: npm run build

  images:
    name: Images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Both published targets, built as the publish workflow builds them
      # (single platform, loaded locally rather than pushed).
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: core
          load: true
          tags: fapost-check/core
          cache-from: type=gha,scope=ci-core
          cache-to: type=gha,mode=max,scope=ci-core

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: web
          load: true
          tags: fapost-check/web
          cache-from: type=gha,scope=ci-web
          cache-to: type=gha,mode=max,scope=ci-web

      # The console view needs the Vite manifest in the PHP container; a core
      # image built without it passes every PHP test and fails in production.
      - run: docker/check-image-assets.sh fapost-check/core fapost-check/web
